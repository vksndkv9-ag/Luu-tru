<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hệ thống Quản lý Hồ sơ Lưu trữ - VKSND Khu vực 9 An Giang</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FBF1E2;
    font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, Helvetica, sans-serif;
  }

  iframe {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    opacity: 0;
    transition: opacity .5s ease;
  }

  iframe.da-tai {
    opacity: 1;
  }

  /* Màn hình chờ - cùng tông màu "cam/đỏ truyền thống" đang dùng trong hệ thống chính (nền kem,
     chữ nâu đỏ, điểm nhấn cam), hiện ngay lập tức trong lúc Apps Script đang khởi động (có thể
     mất vài giây ở lần tải đầu), tự ẩn đi khi trang thật bên trong iframe tải xong. */
  #manHinhCho {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #FBF1E2;
    transition: opacity .5s ease;
  }

  #manHinhCho.an {
    opacity: 0;
    pointer-events: none;
  }

  .cho-logo {
    width: 92px;
    height: auto;
    display: block;
    margin-bottom: 14px;
    mix-blend-mode: multiply;
    animation: choTrenNoi 3.2s ease-in-out infinite;
  }

  @keyframes choTrenNoi {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .cho-ten {
    font-size: 19px;
    font-weight: 700;
    color: #7C2D12;
    text-align: center;
    padding: 0 24px;
    margin-bottom: 6px;
    line-height: 1.35;
  }

  .cho-mota {
    font-size: 13px;
    color: #8A7358;
    text-align: center;
    padding: 0 24px;
    margin-bottom: 30px;
  }

  .cho-vong {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 4px solid rgba(234,88,12,.18);
    border-top-color: #EA580C;
    animation: choXoay .8s linear infinite;
  }

  @keyframes choXoay {
    to { transform: rotate(360deg); }
  }

  .cho-ghi-chu {
    position: absolute;
    bottom: 26px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: #6E5B43;
    padding: 0 24px;
    opacity: 0;
    transition: opacity .4s ease;
  }

  .cho-ghi-chu.hien {
    opacity: 1;
  }
</style>
</head>
